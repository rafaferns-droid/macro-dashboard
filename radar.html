// Flatten all units for scoring/filtering
const ALL_UNITS = PROMOS.flatMap(p => p.unidades.map(u => ({...u, promoId:p.id, zona:p.zona, amenities:p.amenities})));

let V={r:{},m:{}}, prefs={parking:true,piscina:false,gimnasio:false}, zona="Todas", filtro="todos";
let expanded = {}; // which promos are expanded

function save(){try{localStorage.setItem("rpv4",JSON.stringify({V,prefs,expanded}))}catch(e){}}
function load(){try{
  const d=JSON.parse(localStorage.getItem("rpv4")||"{}");
  if(d.V){V=d.V;if(!V.r)V.r={};if(!V.m)V.m={}}
  if(d.prefs)prefs=d.prefs;
  if(d.expanded)expanded=d.expanded;
}catch(e){}}

function sc(u){
  const p = u.precio;
  if(!p) return null;
  let s=50;
  if(p<=B)s+=20;else s-=15;
  if(u.m2>=120)s+=10;else if(u.m2&&u.m2<100)s-=10;
  if(u.terraza>=30)s+=10;else if(u.terraza>=15)s+=5;
  if(u.hab>=4)s+=8;else if(u.hab===3)s+=3;
  if(prefs.parking&&u.amenities?.parking)s+=5;
  if(prefs.piscina&&u.amenities?.piscina)s+=5;
  if(prefs.gimnasio&&u.amenities?.gimnasio)s+=4;
  if(V.r[u.id]==="like"&&V.m[u.id]==="like")s+=15;
  return Math.max(0,Math.min(100,Math.round(s)));
}

function pl(ok,l){return`<span class="pill ${ok?"ok":"no"}">${l}</span>`}
function badge(id){
  const r=V.r[id],m=V.m[id];
  if(r==="like"&&m==="like")return'<span class="badge b-both">💚 Ambos</span>';
  if(r==="dislike"&&m==="dislike")return'<span class="badge b-none">❌ Ambos no</span>';
  if(r&&m&&r!==m)return'<span class="badge b-div">🤔 Dividido</span>';
  return"";
}

function promoScore(promo){
  const scores = promo.unidades.map(u=>sc({...u,amenities:promo.amenities})).filter(s=>s!==null);
  return scores.length ? Math.max(...scores) : null;
}

function promoMatchesFiltro(promo){
  const units = promo.unidades;
  if(filtro==="ambos") return units.some(u=>V.r[u.id]==="like"&&V.m[u.id]==="like");
  if(filtro==="rafa") return units.some(u=>V.r[u.id]==="like");
  if(filtro==="manana") return units.some(u=>V.m[u.id]==="like");
  if(filtro==="sin") return units.every(u=>!V.r[u.id]&&!V.m[u.id]);
  return true;
}

function renderUnit(u, promo){
  const r=V.r[u.id],m=V.m[u.id];
  const s=sc({...u,amenities:promo.amenities});
  const over=u.precio&&u.precio>B;
  const sc2=s>=70?"#34d399":s>=40?"#fbbf24":"#f87171";
  return`<div class="unit" style="background:${r==="like"&&m==="like"?"rgba(52,211,153,.05)":r==="dislike"&&m==="dislike"?"rgba(248,113,113,.05)":""}">
    <div class="unit-top">
      <span class="unit-titulo">${u.titulo}</span>
      <span>
        <span class="unit-precio" style="color:${over?"#fbbf24":"#34d399"}">${fmt(u.precio)}</span>
        ${over?'<div class="sobre">sobre presupuesto</div>':""}
      </span>
    </div>
    <div class="unit-pills">
      ${badge(u.id)}
    </div>
    <div class="unit-footer">
      <div class="unit-left">
        ${s!==null?`<span class="sc" style="color:${sc2};border:1px solid ${sc2};background:${sc2}18">⭐ ${s}%</span>`:""}
        <a class="lnk" href="${u.url}" target="_blank">🔗 Ficha</a>
      </div>
      <div class="votes">
        <div class="vrow">
          <span class="vlbl" style="color:#4f8ef7">Rafa</span>
          <button class="vb ${r==="like"?"lr":""}" onclick="vote('${u.id}','like','r')">👍</button>
          <button class="vb ${r==="dislike"?"dr":""}" onclick="vote('${u.id}','dislike','r')">👎</button>
        </div>
        <div class="vrow">
          <span class="vlbl" style="color:#a78bfa">Manana</span>
          <button class="vb ${m==="like"?"lm":""}" onclick="vote('${u.id}','like','m')">👍</button>
          <button class="vb ${m==="dislike"?"dm":""}" onclick="vote('${u.id}','dislike','m')">👎</button>
        </div>
      </div>
    </div>
  </div>`;
}

function renderPromo(promo){
  const s = promoScore(promo);
  const sc2 = s>=70?"#34d399":s>=40?"#fbbf24":"#f87171";
  const isExp = expanded[promo.id];
  const nUnits = promo.unidades.length;
  const rLikes = promo.unidades.filter(u=>V.r[u.id]==="like").length;
  const mLikes = promo.unidades.filter(u=>V.m[u.id]==="like").length;
  const bothLike = promo.unidades.filter(u=>V.r[u.id]==="like"&&V.m[u.id]==="like").length;
  const prices = promo.unidades.map(u=>u.precio).filter(Boolean);
  const minP = prices.length ? Math.min(...prices) : null;
  const maxP = prices.length ? Math.max(...prices) : null;
  const priceStr = minP===maxP ? fmt(minP) : `${fmt(minP)} – ${fmt(maxP)}`;
  const over = minP && minP > B;

  return`<div class="promo" id="promo-${promo.id}">
    <div class="promo-header" onclick="toggleExpand('${promo.id}')">
      <div class="promo-top">
        <div>
          <div class="promo-name">${promo.zona}</div>
          <div class="promo-title">${promo.nombre}</div>
          <div class="promo-meta">${promo.desc}</div>
          ${promo.notas?`<div class="promo-meta" style="color:#6b7280;margin-top:.2rem;font-size:.65rem">${promo.notas}</div>`:""}
        </div>
        <div class="promo-right">
          <div class="promo-range" style="color:${over?"#fbbf24":"#34d399"}">${priceStr}</div>
          <div class="promo-pills">
            ${pl(promo.amenities.parking,"🅿️")}
            ${pl(promo.amenities.piscina,"🏊")}
            ${pl(promo.amenities.gimnasio,"🏋️")}
            ${s!==null?`<span class="sc" style="color:${sc2};border:1px solid ${sc2};background:${sc2}18">⭐${s}%</span>`:""}
          </div>
          <div style="display:flex;gap:.3rem;flex-wrap:wrap;justify-content:flex-end;margin-top:.2rem">
            ${rLikes>0?`<span style="font-size:.6rem;color:#4f8ef7">Rafa ${rLikes}👍</span>`:""}
            ${mLikes>0?`<span style="font-size:.6rem;color:#a78bfa">Manana ${mLikes}👍</span>`:""}
            ${bothLike>0?`<span style="font-size:.6rem;color:#34d399">${bothLike}💚</span>`:""}
          </div>
          <a class="lnk" href="${promo.url_promo}" target="_blank" onclick="event.stopPropagation()">🔗 Promoción</a>
        </div>
      </div>
      <button class="expand-btn">${isExp?"▲ Ocultar":"▼ Ver"} ${nUnits} unidad${nUnits>1?"es":""}</button>
    </div>
    ${isExp?`<div class="promo-units">${promo.unidades.map(u=>renderUnit(u,promo)).join("")}</div>`:""}
  </div>`;
}

function toggleExpand(id){expanded[id]=!expanded[id];save();render();}
function vote(id,tipo,u){
  V[u][id]=V[u][id]===tipo?undefined:tipo;
  if(!V[u][id])delete V[u][id];
  save();render();
}

function render(){
  const allUnits=ALL_UNITS;
  const rL=Object.values(V.r).filter(v=>v==="like").length;
  const mL=Object.values(V.m).filter(v=>v==="like").length;
  const both=allUnits.filter(u=>V.r[u.id]==="like"&&V.m[u.id]==="like").length;
  document.getElementById("stats").innerHTML=
    `${PROMOS.length} promociones · ${allUnits.length} unidades · <span style="color:#4f8ef7">Rafa ${rL}👍</span> · <span style="color:#a78bfa">Manana ${mL}👍</span> · <span style="color:#34d399">${both} coinciden 💚</span>`;

  document.getElementById("prefs").innerHTML=PK.map(([k,l])=>
    `<button class="btn" style="border:1px solid ${prefs[k]?"#4f8ef7":"#2a3047"};background:${prefs[k]?"rgba(79,142,247,.2)":"transparent"};color:${prefs[k]?"#4f8ef7":"#6b7280"};font-weight:${prefs[k]?600:400}" onclick="togglePref('${k}')">${l}</button>`
  ).join("");

  document.getElementById("zonas").innerHTML=ZONAS.map(z=>
    `<button class="btn" style="border:1px solid ${zona===z?"#4f8ef7":"#2a3047"};background:${zona===z?"rgba(79,142,247,.2)":"transparent"};color:${zona===z?"#4f8ef7":"#6b7280"};font-weight:${zona===z?600:400}" onclick="setZona('${z}')">${z}</button>`
  ).join("");

  document.getElementById("filtros").innerHTML=FILTROS.map(([k,l])=>
    `<button class="btn" style="border:1px solid ${filtro===k?"#34d399":"#2a3047"};background:${filtro===k?"rgba(52,211,153,.15)":"transparent"};color:${filtro===k?"#34d399":"#6b7280"};font-weight:${filtro===k?600:400}" onclick="setFiltro('${k}')">${l}</button>`
  ).join("");

  let lista=PROMOS
    .filter(p=>zona==="Todas"||p.zona===zona)
    .filter(p=>promoMatchesFiltro(p))
    .sort((a,b)=>(promoScore(b)??-1)-(promoScore(a)??-1));

  document.getElementById("cards").innerHTML=lista.length
    ?lista.map(renderPromo).join("")
    :'<div class="empty">No hay promociones en esta selección.</div>';
}

function togglePref(k){prefs[k]=!prefs[k];save();render();}
function setZona(z){zona=z;render();}
function setFiltro(f){filtro=f;render();}

load();render();
</script>
