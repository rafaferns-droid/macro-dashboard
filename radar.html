.lnk{font-size:.64rem;color:#4f8ef7;text-decoration:none;border:1px solid rgba(79,142,247,.3);border-radius:6px;padding:2px 7px}
.votes{display:flex;flex-direction:column;gap:.3rem}
.vrow{display:flex;align-items:center;gap:.25rem}
.vlbl{font-size:.62rem;font-weight:600;min-width:44px;text-align:right}
.vb{border:none;border-radius:7px;padding:2px 9px;font-size:.78rem;background:rgba(255,255,255,.06);color:#6b7280;cursor:pointer;font-family:inherit;transition:all .15s}
.vb.lr{background:rgba(79,142,247,.25);color:#4f8ef7}
.vb.dr{background:rgba(248,113,113,.2);color:#f87171}
.vb.lm{background:rgba(167,139,250,.25);color:#a78bfa}

.b-both{background:rgba(52,211,153,.15);color:#34d399;border-color:rgba(52,211,153,.4)}
.b-div{background:rgba(251,191,36,.12);color:#fbbf24;border-color:rgba(251,191,36,.3)}
.b-none{background:rgba(248,113,113,.12);color:#f87171;border-color:rgba(248,113,113,.3)}
.empty{text-align:center;color:#6b7280;padding:2rem;font-size:.83rem}

let V={r:{},m:{}}, prefs={parking:true,piscina:false,gimnasio:false}, zona="Todas", filtro="todos";

function save(){try{localStorage.setItem("rpv3",JSON.stringify({V,prefs}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem("rpv3")||"{}");if(d.V){V=d.V;if(!V.r)V.r={};if(!V.m)V.m={}}if(d.prefs)prefs=d.prefs}catch(e){}}

function sc(p){
  if(!p.precio)return null;
  let s=50;
  if(p.precio<=B)s+=20;else s-=15;
  if(p.m2>=120)s+=10;else if(p.m2&&p.m2<100)s-=10;
  if(p.terraza>=30)s+=10;else if(p.terraza>=15)s+=5;
  if(p.hab>=4)s+=8;else if(p.hab===3)s+=3;
  if(prefs.parking&&p.parking)s+=5;
  if(prefs.piscina&&p.piscina)s+=5;
  if(prefs.gimnasio&&p.gimnasio)s+=4;
  if(p.vistas?.toLowerCase().includes("mar"))s+=8;
  if(p.estado.includes("nueva"))s+=5;
  if(V.r[p.id]==="like"&&V.m[p.id]==="like")s+=15;
  return Math.max(0,Math.min(100,Math.round(s)));
}

function pl(ok,l){return`<span class="pill ${ok?"ok":"no"}">${l}</span>`}

function badge(id){
  const r=V.r[id],m=V.m[id];
  if(r==="like"&&m==="like")return'<span class="badge b-both">💚 Ambos</span>';
  if(r==="dislike"&&m==="dislike")return'<span class="badge b-none">❌ Ambos no</span>';
  if(r&&m&&r!==m)return'<span class="badge b-div">🤔 Dividido</span>';
  return"";
}

function card(p){
  const r=V.r[p.id],m=V.m[p.id];
  const s=sc(p),over=p.precio&&p.precio>B;
  const sc2=s>=70?"#34d399":s>=40?"#fbbf24":"#f87171";
  const bl=r==="like"&&m==="like",bn=r==="dislike"&&m==="dislike";
  return`<div class="card" style="border-color:${bl?"rgba(52,211,153,.5)":bn?"rgba(248,113,113,.35)":"#2a3047"};opacity:${bn?.4:1}">
    <div class="card-top">
      <div style="flex:1"><div class="card-complejo">${p.complejo}</div><div class="card-titulo">${p.titulo}</div></div>
      <div style="text-align:right;flex-shrink:0"><div class="precio" style="color:${over?"#fbbf24":"#34d399"}">${fmt(p.precio)}</div>${over?'<div class="sobre">sobre presupuesto</div>':""}</div>
    </div>
    <div class="pills">
      ${p.m2?pl(p.m2>=120,p.m2+"m²"):""}
      ${p.terraza!=null?pl(p.terraza>=20,"☀️ "+p.terraza+"m²"):""}
      ${p.hab?pl(p.hab>=4,p.hab+" hab"):""}
      ${p.planta?pl(true,p.planta):""}
      ${pl(p.parking,"🅿️")}${pl(p.piscina,"🏊")}${pl(p.gimnasio,"🏋️")}
      ${p.vistas?pl(p.vistas.toLowerCase().includes("mar"),"👁 "+p.vistas):""}
      ${pl(p.estado.includes("nueva"),p.estado)}
      ${badge(p.id)}
    </div>
    ${p.notas?`<div class="notas">${p.notas}</div>`:""}
    <div class="footer">
      <div class="left">
        ${s!==null?`<span class="sc" style="color:${sc2};border:1px solid ${sc2};background:${sc2}18">⭐ ${s}%</span>`:""}
        <a class="lnk" href="${p.url}" target="_blank">🔗 ${p.fuente}</a>
      </div>
      <div class="votes">
        <div class="vrow">
          <span class="vlbl" style="color:#4f8ef7">Rafa</span>
          <button class="vb ${r==="like"?"lr":""}" onclick="vote('${p.id}','like','r')">👍</button>
          <button class="vb ${r==="dislike"?"dr":""}" onclick="vote('${p.id}','dislike','r')">👎</button>
        </div>
        <div class="vrow">
          <span class="vlbl" style="color:#a78bfa">Manana</span>
          <button class="vb ${m==="like"?"lm":""}" onclick="vote('${p.id}','like','m')">👍</button>
          <button class="vb ${m==="dislike"?"dm":""}" onclick="vote('${p.id}','dislike','m')">👎</button>
        </div>
      </div>
    </div>
  </div>`;
}

function vote(id,tipo,u){
  V[u][id]=V[u][id]===tipo?undefined:tipo;
  if(!V[u][id])delete V[u][id];
  save();render();
}

function render(){
  const rL=Object.values(V.r).filter(v=>v==="like").length;
  const mL=Object.values(V.m).filter(v=>v==="like").length;
  const both=PISOS.filter(p=>V.r[p.id]==="like"&&V.m[p.id]==="like").length;
  document.getElementById("stats").innerHTML=
    `${PISOS.length} pisos · <span style="color:#4f8ef7">Rafa ${rL}👍</span> · <span style="color:#a78bfa">Manana ${mL}👍</span> · <span style="color:#34d399">${both} coinciden 💚</span>`;

  document.getElementById("prefs").innerHTML=PK.map(([k,l])=>
    `<button class="btn" style="border:1px solid ${prefs[k]?"#4f8ef7":"#2a3047"};background:${prefs[k]?"rgba(79,142,247,.2)":"transparent"};color:${prefs[k]?"#4f8ef7":"#6b7280"};font-weight:${prefs[k]?600:400}" onclick="togglePref('${k}')">${l}</button>`
  ).join("");

  document.getElementById("zonas").innerHTML=ZONAS.map(z=>
    `<button class="btn" style="border:1px solid ${zona===z?"#4f8ef7":"#2a3047"};background:${zona===z?"rgba(79,142,247,.2)":"transparent"};color:${zona===z?"#4f8ef7":"#6b7280"};font-weight:${zona===z?600:400}" onclick="setZona('${z}')">${z}</button>`
  ).join("");

  document.getElementById("filtros").innerHTML=FILTROS.map(([k,l])=>
    `<button class="btn" style="border:1px solid ${filtro===k?"#34d399":"#2a3047"};background:${filtro===k?"rgba(52,211,153,.15)":"transparent"};color:${filtro===k?"#34d399":"#6b7280"};font-weight:${filtro===k?600:400}" onclick="setFiltro('${k}')">${l}</button>`
  ).join("");

  let lista=PISOS.filter(p=>zona==="Todas"||p.zona===zona);
  if(filtro==="ambos") lista=lista.filter(p=>V.r[p.id]==="like"&&V.m[p.id]==="like");
  else if(filtro==="rafa") lista=lista.filter(p=>V.r[p.id]==="like");
  else if(filtro==="manana") lista=lista.filter(p=>V.m[p.id]==="like");
  else if(filtro==="sin") lista=lista.filter(p=>!V.r[p.id]&&!V.m[p.id]);
  lista.sort((a,b)=>(sc(b)??-1)-(sc(a)??-1));

  document.getElementById("cards").innerHTML=lista.length
    ?lista.map(card).join("")
    :'<div class="empty">No hay pisos en esta selección.</div>';
}

function togglePref(k){prefs[k]=!prefs[k];save();render();}
function setZona(z){zona=z;render();}
function setFiltro(f){filtro=f;render();}

load();render();
</script>
</body>
</html>
