<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f1117;color:#e8eaf0;font-family:system-ui,-apple-system,sans-serif;padding:1rem;max-width:640px;margin:0 auto}
h1{font-size:1.3rem;font-weight:700;margin-bottom:.25rem}
.sub{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:#6b7280;margin-bottom:.15rem}
.stats{font-size:.7rem;color:#6b7280;margin-bottom:1rem}
.prefs-block{background:#181c27;border:1px solid #2a3047;border-radius:12px;padding:.65rem .9rem;margin-bottom:.8rem}
.prefs-title{font-size:.57rem;text-transform:uppercase;letter-spacing:.08em;color:#6b7280;margin-bottom:.35rem}
.prefs-btns{display:flex;gap:.35rem;flex-wrap:wrap}
.zones{display:flex;gap:.28rem;flex-wrap:wrap;margin-bottom:.5rem}
.filters{display:flex;gap:.28rem;margin-bottom:.85rem}
button{font-family:inherit;cursor:pointer}
.btn{border-radius:8px;padding:4px 11px;font-size:.74rem;font-weight:400;transition:all .15s}
.card{background:#1e2333;border:1px solid #2a3047;border-radius:14px;padding:.85rem;margin-bottom:.65rem;transition:opacity .2s}
.card.disliked{opacity:.4}
.card.liked{border-color:rgba(52,211,153,.45)}
.card.disliked{border-color:rgba(248,113,113,.3)}
.card-top{display:flex;justify-content:space-between;gap:.5rem;margin-bottom:.35rem}
.card-complejo{font-size:.57rem;text-transform:uppercase;letter-spacing:.08em;color:#6b7280;margin-bottom:2px}
.card-titulo{font-size:.83rem;font-weight:600;color:#e8eaf0;line-height:1.4}
.card-precio{font-family:monospace;font-size:.88rem;font-weight:700}
.card-sobre{font-size:.58rem;color:#fbbf24}
.pills{display:flex;flex-wrap:wrap;gap:.22rem;margin-bottom:.45rem}
.pill{display:inline-block;font-size:.6rem;font-weight:600;padding:2px 6px;border-radius:99px}
.pill-ok{background:rgba(52,211,153,.15);color:#34d399;border:1px solid rgba(52,211,153,.3)}
.pill-no{background:rgba(107,114,128,.1);color:#6b7280;border:1px solid #2a3047}
.notas{font-size:.67rem;color:#9ca3af;line-height:1.55;margin-bottom:.45rem;border-left:2px solid #2a3047;padding-left:.5rem}
.card-footer{display:flex;justify-content:space-between;align-items:center}
.card-actions{display:flex;gap:.3rem;align-items:center}
.score{font-family:monospace;font-size:.68rem;font-weight:700;border-radius:6px;padding:1px 6px}
.link-btn{font-size:.64rem;color:#4f8ef7;text-decoration:none;border:1px solid rgba(79,142,247,.3);border-radius:6px;padding:2px 7px}
.vote-btns{display:flex;gap:.28rem}
.vote-btn{border:none;border-radius:8px;padding:3px 10px;font-size:.8rem;background:rgba(255,255,255,.06);color:#6b7280;transition:all .15s}
.vote-btn.like-active{background:rgba(52,211,153,.25);color:#34d399}
.vote-btn.dislike-active{background:rgba(248,113,113,.2);color:#f87171}
.empty{text-align:center;color:#6b7280;padding:2rem;font-size:.83rem}
.save-msg{font-size:.65rem;margin-left:.5rem}
.save-ok{color:#34d399}
.save-err{color:#f87171}
</style>
</head>

];

const ZONAS = ["Todas","Diagonal Mar","Badalona Puerto","El Gorg","El Masnou","Poblenou"];
const PREFS_KEYS = [["parking","🅿️ Parking"],["piscina","🏊 Piscina"],["gimnasio","🏋️ Gym"]];

let votos = {}, prefs = {parking:true,piscina:false,gimnasio:false};
let zona = "Todas", filtro = "todos";

function save() {
  try {
    localStorage.setItem("rf-votos-v2", JSON.stringify(votos));
    localStorage.setItem("rf-prefs-v2", JSON.stringify(prefs));
  } catch(e) {}
}

function load() {
  try {
    const v = localStorage.getItem("rf-votos-v2");
    if (v) votos = JSON.parse(v);
    const p = localStorage.getItem("rf-prefs-v2");
    if (p) prefs = JSON.parse(p);
  } catch(e) {}
}

function calcScore(p) {
  if (!p.precio) return null;
  let s = 50;
  if (p.precio <= BUDGET) s += 20; else s -= 15;
  if (p.m2 >= 120) s += 10; else if (p.m2 && p.m2 < 100) s -= 10;
  if (p.terraza >= 30) s += 10; else if (p.terraza >= 15) s += 5;
  if (p.hab >= 4) s += 8; else if (p.hab === 3) s += 3;
  if (prefs.parking && p.parking) s += 5;
  if (prefs.piscina && p.piscina) s += 5;
  if (prefs.gimnasio && p.gimnasio) s += 4;
  if (p.vistas?.toLowerCase().includes("mar")) s += 8;
  if (p.estado.includes("nueva")) s += 5;
  return Math.max(0, Math.min(100, Math.round(s)));
}

function pill(ok, label) {
  return `<span class="pill ${ok?'pill-ok':'pill-no'}">${label}</span>`;
}

function renderCard(p) {
  const v = votos[p.id];
  const s = calcScore(p);
  const over = p.precio && p.precio > BUDGET;
  const sc = s >= 70 ? "#34d399" : s >= 40 ? "#fbbf24" : "#f87171";
  return `<div class="card ${v==='like'?'liked':v==='dislike'?'disliked':''}" id="card-${p.id}">
    <div class="card-top">
      <div>
        <div class="card-complejo">${p.complejo}</div>
        <div class="card-titulo">${p.titulo}</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div class="card-precio" style="color:${over?'#fbbf24':'#34d399'}">${fmt(p.precio)}</div>
        ${over?'<div class="card-sobre">sobre presupuesto</div>':''}
      </div>
    </div>
    <div class="pills">
      ${p.m2?pill(p.m2>=120,p.m2+'m²'):''}
      ${p.terraza!=null?pill(p.terraza>=20,'☀️ '+p.terraza+'m²'):''}
      ${p.hab?pill(p.hab>=4,p.hab+' hab'):''}
      ${p.planta?pill(true,p.planta):''}
      ${pill(p.parking,'🅿️')}
      ${pill(p.piscina,'🏊')}
      ${pill(p.gimnasio,'🏋️')}
      ${p.vistas?pill(p.vistas.toLowerCase().includes('mar'),'👁 '+p.vistas):''}
      ${pill(p.estado.includes('nueva'),p.estado)}
    </div>
    ${p.notas?`<div class="notas">${p.notas}</div>`:''}
    <div class="card-footer">
      <div class="card-actions">
        ${s!==null?`<span class="score" style="color:${sc};border:1px solid ${sc};background:${sc}18">⭐ ${s}%</span>`:''}
        <a class="link-btn" href="${p.url}" target="_blank">🔗 ${p.fuente}</a>
      </div>
      <div class="vote-btns">
        <button class="vote-btn ${v==='like'?'like-active':''}" onclick="vote('${p.id}','like')">👍</button>
        <button class="vote-btn ${v==='dislike'?'dislike-active':''}" onclick="vote('${p.id}','dislike')">👎</button>
      </div>
    </div>
  </div>`;
}

function vote(id, tipo) {
  votos[id] = votos[id] === tipo ? undefined : tipo;
  if (!votos[id]) delete votos[id];
  save();
  render();
}

function render() {
  // Stats
  const likes = Object.values(votos).filter(v=>v==='like').length;
  const dislikes = Object.values(votos).filter(v=>v==='dislike').length;
  document.getElementById('stats').textContent = `${PISOS.length} pisos · ${likes} 👍 · ${dislikes} 👎`;

  // Prefs
  document.getElementById('prefs-btns').innerHTML = PREFS_KEYS.map(([k,l]) =>
    `<button class="btn" style="border:1px solid ${prefs[k]?'#4f8ef7':'#2a3047'};background:${prefs[k]?'rgba(79,142,247,.2)':'transparent'};color:${prefs[k]?'#4f8ef7':'#6b7280'};font-weight:${prefs[k]?600:400}"
      onclick="togglePref('${k}')">${l}</button>`
  ).join('');

  // Zones
  document.getElementById('zones').innerHTML = ZONAS.map(z =>
    `<button class="btn" style="border:1px solid ${zona===z?'#4f8ef7':'#2a3047'};background:${zona===z?'rgba(79,142,247,.2)':'transparent'};color:${zona===z?'#4f8ef7':'#6b7280'};font-weight:${zona===z?600:400}"
      onclick="setZona('${z}')">${z}</button>`
  ).join('');

  // Filters
  const fs = [['todos','Todos'],['likes','👍 Guardados'],['pendientes','⏳ Pendientes']];
  document.getElementById('filters').innerHTML = fs.map(([k,l]) =>
    `<button class="btn" style="border:1px solid ${filtro===k?'#34d399':'#2a3047'};background:${filtro===k?'rgba(52,211,153,.15)':'transparent'};color:${filtro===k?'#34d399':'#6b7280'};font-weight:${filtro===k?600:400}"
      onclick="setFiltro('${k}')">${l}</button>`
  ).join('');

  // Cards
  const lista = PISOS
    .filter(p => zona === 'Todas' || p.zona === zona)
    .filter(p => filtro === 'likes' ? votos[p.id] === 'like' : filtro === 'pendientes' ? !votos[p.id] : true)
    .sort((a,b) => (calcScore(b)??-1) - (calcScore(a)??-1));

  document.getElementById('cards').innerHTML = lista.length
    ? lista.map(renderCard).join('')
    : '<div class="empty">No hay pisos en esta selección.</div>';
}

function togglePref(k) { prefs[k] = !prefs[k]; save(); render(); }
function setZona(z) { zona = z; render(); }
function setFiltro(f) { filtro = f; render(); }

load();
render();
</script>
</body>
</html>
